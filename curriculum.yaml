          - "Implement chunking strategies"
          - "Handle document preprocessing"

      - seq: 3
        name: "Advanced RAG Patterns"
        legacy_id: "13"
        hours: "6-8"
        status: complete
        heureka: true
        prerequisites: ["3.2"]
        objectives:
          - "Implement HyDE, query decomposition"
          - "Build multi-hop retrieval"
          - "Master reranking and filtering"

      - seq: 4
        name: "RAG Evaluation & Optimization"
        legacy_id: "14"
        hours: "5-6"
        status: complete
        prerequisites: ["3.3"]
        objectives:
          - "Evaluate RAG with RAGAS metrics"
