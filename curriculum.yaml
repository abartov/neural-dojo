# Neural Dojo Curriculum Configuration
# =====================================
# This is the SINGLE SOURCE OF TRUTH for the curriculum structure.
# Run `python scripts/generate_curriculum.py` to regenerate index files.
#
# Structure:
#   - Phases contain modules
#   - Modules are numbered sequentially within each phase (1, 2, 3...)
#   - Global module IDs are auto-generated as P{phase}.{sequence}
#   - Legacy modules (before refactor) keep their original IDs for compatibility

version: "2.0.0"
last_updated: "2025-12-09"
title: "Neural Dojo: Master Curriculum"
subtitle: "From Zero to AI Guru: Master AI, ML, LLMs, and AI-Driven Development"

# Curriculum-wide settings
settings:
  total_weeks: "52-62"
  total_hours: "230-310"

phases:
  # ==========================================================================
  # PHASE 0: Prerequisites
  # ==========================================================================
  - id: 0
    name: "Prerequisites & Environment Setup"
    description: "Prepare your development environment before starting"
    weeks: "0"
    status: complete
    modules:
      - seq: 0
        name: "Prerequisites & Environment Setup"
        legacy_id: "00"  # Maps to module_00
        hours: "2-3"
        status: complete
        prerequisites: []
        objectives:
          - "Verify prerequisites (Python 3.10+, command line basics)"
          - "Set up development environment (venv, pip, IDE)"
          - "Configure API keys for Claude and/or OpenAI"
          - "Make your first LLM API call"
        deliverables:
          - "Python 3.10+ environment verified"
          - "Virtual environment created and activated"
          - ".env file with API key(s) configured"
          - "All test scripts passing"

  # ==========================================================================
  # PHASE 1: AI-Native Development
  # ==========================================================================
  - id: 1
    name: "AI-Native Development"
    description: "Master using AI as your development partner"
    weeks: "1-5"
    status: complete
    modules:
      - seq: 1
        name: "AI Coding Tools Landscape"
        legacy_id: "01.1"  # Maps to module_01.1
        hours: "4-5"
        status: complete
        prerequisites: []
        objectives:
          - "Understand the AI development landscape (2024-2025)"
          - "Set up AI coding assistants (Claude Code, Cursor, GitHub Copilot)"
          - "Learn the mental model of AI pair programming"
          - "Master subscriptions vs API access distinction"

      - seq: 2
        name: "Local Models for AI Coding"
        legacy_id: "01.2"  # Maps to module_01.2
        hours: "3-4"
        status: complete
        prerequisites: ["1.1"]
        objectives:
          - "Install and run Ollama (local model management)"
          - "Use local models with Aider and Continue.dev"
          - "Implement hybrid approach (80% local, 20% API)"
          - "Optimize costs ($0-5/month vs $50-150/month)"

      - seq: 3
        name: "Claude Code & CLI Deep Dive"
        legacy_id: "01.3"  # Uses module_01.3 theory, module_01 examples
        hours: "4-5"
        status: complete
        prerequisites: ["1.1"]
        objectives:
          - "Master Claude Code's multi-modal operation"
          - "Configure settings.json and CLAUDE.md"
          - "Build custom slash commands and skills"
          - "Implement hooks for automation"

      - seq: 4
        name: "Agent-First IDEs"
        legacy_id: "01.4"  # Maps to module_01.4
        hours: "4-6"
        status: complete
        prerequisites: ["1.1"]
        objectives:
          - "Understand the evolution from autocomplete to agentic IDEs"
          - "Master Google Antigravity's multi-agent architecture"
          - "Use Windsurf's Cascade system with memory and Flows"
          - "Configure Cline's open-source agent capabilities"
          - "Compare Cursor's Composer mode for multi-file editing"

      - seq: 5
        name: "CLI AI Coding Agents"
        legacy_id: "01.5"  # Maps to module_01.5
        hours: "4-6"
        status: complete
        prerequisites: ["1.3", "1.4"]
        objectives:
          - "Master Claude Code's hooks, MCP servers, and slash commands"
          - "Use Aider for git-native AI pair programming"
          - "Explore Goose and other CLI agents"
          - "Build automated CLI workflows and pipelines"
          - "Know when to choose CLI vs IDE agents"

      - seq: 6
        name: "Prompt Engineering Fundamentals"
        legacy_id: "02"  # Maps to module_02
        hours: "5-6"
        status: complete
        heureka: true
        prerequisites: ["1.1"]
        objectives:
          - "Master the art of prompt engineering"
          - "Understand prompt structure (system, user, assistant)"
          - "Learn few-shot learning and chain-of-thought"
          - "Handle edge cases and failure modes"

      - seq: 7
        name: "AI-Powered Code Generation"
        legacy_id: "03"  # Maps to module_03
        hours: "4-5"
        status: complete
        prerequisites: ["1.6"]
        objectives:
          - "Generate code from natural language"
          - "Refactor and debug with AI"
          - "Write tests using AI"

      - seq: 8
        name: "AI-Assisted Debugging & Optimization"
        legacy_id: "04"  # Maps to module_04
        hours: "4-5"
        status: complete
        prerequisites: ["1.7"]
        objectives:
          - "Use AI to find and fix bugs"
          - "Optimize performance with AI"
          - "Understand AI's debugging strategies"

      - seq: 9
        name: "Building with AI Coding Assistants"
        legacy_id: "05"  # Maps to module_05
        hours: "5-6"
        status: complete
        prerequisites: ["1.8"]
        objectives:
          - "Master Claude Code, Copilot, Cursor workflows"
          - "Build a complete project with AI assistance"
          - "Develop your personal AI workflow"

  # ==========================================================================
  # PHASE 2: Generative AI Fundamentals
  # ==========================================================================
  - id: 2
    name: "Generative AI Fundamentals"
    description: "Deep understanding of LLMs and how they work"
    weeks: "6-10"
    status: complete
    modules:
      - seq: 1
        name: "Introduction to Large Language Models"
        legacy_id: "06"
        hours: "5-6"
        status: complete
        prerequisites: ["Phase 1"]
        objectives:
          - "Understand transformer architecture at a high level"
          - "Learn about GPT, Claude, Llama, and other LLMs"
          - "Compare open-source vs proprietary models"
          - "Understand context windows and limitations"

      - seq: 2
        name: "Tokenization & Text Processing"
        legacy_id: "07"
        hours: "4-5"
        status: complete
        prerequisites: ["2.1"]
        objectives:
          - "Understand how text becomes tokens"
          - "Learn about BPE, WordPiece, SentencePiece"
          - "Master token counting and optimization"

      - seq: 3
        name: "Text Generation & Sampling Strategies"
        legacy_id: "08"
        hours: "5-6"
        status: complete
        prerequisites: ["2.2"]
        objectives:
          - "Understand autoregressive generation"
          - "Master temperature, top-p, top-k sampling"
          - "Learn about beam search and nucleus sampling"

      - seq: 4
        name: "Embeddings & Semantic Search"
        legacy_id: "09"
        hours: "5-6"
        status: complete
        prerequisites: ["2.3"]
        objectives:
          - "Understand embedding vectors"
          - "Learn similarity measures (cosine, dot product)"
          - "Build basic semantic search"

      - seq: 5
        name: "Vector Space Visualization"
        legacy_id: "10"
        hours: "4-5"
        status: complete
        heureka: true
        prerequisites: ["2.4"]
        objectives:
          - "Visualize embeddings in 2D/3D"
          - "Understand dimensionality reduction (PCA, t-SNE, UMAP)"
          - "Explore semantic relationships in vector space"

  # ==========================================================================
  # PHASE 3: Vector Search & RAG
  # ==========================================================================
  - id: 3
    name: "Vector Search & RAG"
    description: "Build production-ready retrieval-augmented generation systems"
    weeks: "11-14"
